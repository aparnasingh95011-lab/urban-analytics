# UrbanStay Analytics - MySQL for local development and demo
# Run: docker-compose up -d
# Then: python scripts/run_schema.py && python etl/load_data.py

version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: urbanstay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urbanstay_analytics
      MYSQL_USER: urbanstay
      MYSQL_PASSWORD: urbanstay
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
